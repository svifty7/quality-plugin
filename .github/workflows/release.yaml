name: Release

# Publishes the version from package.json after it lands in main.
# Bump it in a PR with `pnpm release`; a push without a version change is a no-op.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yaml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          published=false
          if npm view "$name@$version" version >/dev/null 2>&1; then
            published=true
          fi

          tagged=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          echo "$name@$version: published=$published, tagged=$tagged"

      - uses: ./.github/actions/setup
        if: steps.version.outputs.published == 'false' || steps.version.outputs.tagged == 'false'
        with:
          registry-url: https://registry.npmjs.org

      - name: Build
        if: steps.version.outputs.published == 'false'
        run: pnpm run build

      # Trusted publishing needs npm >= 11.5.1; scripts are skipped because
      # the build ran above
      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: |
          npm install -g npm@^11.5.1
          npm publish --ignore-scripts

      - name: Push tag
        if: steps.version.outputs.tagged == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: GitHub release
        if: steps.version.outputs.tagged == 'false'
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
